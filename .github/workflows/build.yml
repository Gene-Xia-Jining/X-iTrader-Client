name: Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          # 差量判定需要与上一版本 tag 做 git diff，拉取完整历史与 tags
          fetch-depth: 0

      - name: Read version from src/__init__.py
        id: ver
        run: |
          VER=$(grep -m1 '^__version__' src/__init__.py | sed 's/.*"\(.*\)"/\1/')
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=$VER" >> "$GITHUB_OUTPUT"

      - name: Create tag
        uses: rickstaa/action-create-tag@v1
        with:
          tag: ${{ steps.ver.outputs.tag }}
          message: "Release ${{ steps.ver.outputs.version }}"
          force_push_tag: true

      # 差量更新：仅当相对上一版本 tag 只有 src/ 下文件变化时，发布全平台共用的
      # src 补丁包（客户端打包时已把 src 外置，替换该目录即完成更新）。
      # 判定为否时不发布补丁包，客户端自动回退下载全量包。
      - name: Build src patch if patch-only change
        id: patch
        run: |
          PREV=$(git tag --sort=-creatordate | grep -vxF "${{ steps.ver.outputs.tag }}" | head -1 || true)
          if [ -z "$PREV" ]; then
            echo "No previous tag; skip patch"
            echo "built=false" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$PREV" HEAD -- . ':(exclude)src/**' | grep -q .; then
            echo "Non-src files changed since $PREV; skip patch"
            echo "built=false" >> "$GITHUB_OUTPUT"
          else
            zip -r "x-itrader-client-${{ steps.ver.outputs.version }}-src.zip" src \
              -x '*/__pycache__/*' '*.pyc'
            echo "built=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload patch artifact
        if: steps.patch.outputs.built == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: x-itrader-client-src-patch
          path: x-itrader-client-*-src.zip

  build:
    needs: version
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      # 后端拼装脚本与 build.sh 都调 uv（下载 python-build-standalone、装依赖），
      # 不再需要 setup-python 与 pip：构建期运行时由 uv 钉在 build/py-runtime 下。
      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Show toolchain
        shell: bash
        run: |
          uv --version
          python3 -V 2>/dev/null || python -V

      # python-build-standalone 运行时下载约 50~70M，缓存后能省掉每次的下载与解包
      - name: Restore pbs runtime cache
        uses: actions/cache@v4
        with:
          path: build/py-runtime
          key: pbs-${{ runner.os }}-${{ hashFiles('specs/build_backend.py') }}-${{ github.run_id }}
          restore-keys: |
            pbs-${{ runner.os }}-${{ hashFiles('specs/build_backend.py') }}-
            pbs-${{ runner.os }}-

      # ---------- macOS ----------

      # SwiftPM 的增量编译依赖 .build 内的元数据与模块产物，冷启动全量约 30s。
      # 该缓存只在 workspace 绝对路径不变时有效（SwiftPM 用绝对路径索引产物），
      # GitHub Actions 的 workspace 固定为 /Users/runner/work/<repo>/<repo>，
      # 因此可跨运行复用。
      - name: Resolve Swift cache key (macOS)
        if: runner.os == 'macOS'
        id: swift-cache
        run: |
          # 工具链升级会改变目标文件，纳入 key 避免复用不兼容的旧产物
          VER=$(swift --version 2>&1 | sed -n 's/.*Swift version \([0-9.]*\).*/\1/p' | head -1)
          echo "key=swift-${VER:-unknown}-${{ hashFiles('shell/Package.swift', 'shell/Package.resolved') }}" >> "$GITHUB_OUTPUT"

      - name: Restore Swift build cache (macOS)
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: shell/.build
          # 带 run_id：每次运行保存一份新缓存（源码变化后增量重建的产物得以留存）；
          # restore-keys 前缀匹配，取同一工具链/依赖定义下最近的一份
          key: ${{ steps.swift-cache.outputs.key }}-${{ github.run_id }}
          restore-keys: |
            ${{ steps.swift-cache.outputs.key }}-

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          # build.sh 产出 .app（含嵌入式 Python 后端），build_dmg.sh 再封装成
          # dmg；两者都落在仓库上一级。
          ./build.sh
          ./build_dmg.sh

      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          # dmg 已在仓库上一级生成，移入仓库 build/ 供 upload-artifact 收集
          mkdir -p "$GITHUB_WORKSPACE/build"
          mv ../X-iTrader-Client-${{ needs.version.outputs.version }}-Mac.dmg "$GITHUB_WORKSPACE/build/"

      # ---------- Windows ----------

      - name: Setup .NET (Windows)
        if: runner.os == 'Windows'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build backend (Windows)
        if: runner.os == 'Windows'
        run: |
          # 与 macOS 同一条拼装链：嵌入式 Python 运行时 + uv 装依赖 + 源码外置。
          # 拼装脚本只用标准库，用 uv 的解释器跑即可（CI 不建 .venv）。
          # 产物 build/backend/{runtime,code}
          uv run --python 3.14 --no-project -- specs/build_backend.py --output build/backend
          if (-not (Test-Path "build/backend/runtime/python.exe")) {
            Write-Error "未找到后端运行时 build/backend/runtime/python.exe"
            exit 1
          }
          if (-not (Test-Path "build/backend/code/backend_entry.py")) {
            Write-Error "未找到后端入口 build/backend/code/backend_entry.py"
            exit 1
          }
        shell: pwsh

      - name: Publish shell (Windows)
        if: runner.os == 'Windows'
        run: |
          # 自包含发布：.NET 运行时与 Windows App SDK 原生库都进产物，
          # 目标机无需安装任何运行环境（自包含由 csproj 的 SelfContained=true
          # 决定，命令行不再覆盖）
          dotnet publish shell-windows/X-iTrader.Shell.csproj `
            -c Release -r win-x64 -p:Platform=x64 `
            -o build/shell
          if (-not (Test-Path "build/shell/X-iTrader.exe")) {
            Write-Error "未找到壳产物 build/shell/X-iTrader.exe"
            exit 1
          }
        shell: pwsh

      - name: Trim shell language resources (Windows)
        if: runner.os == 'Windows'
        run: |
          # 裁掉 WinUI 原生库的 86 种语言 .mui（保留 zh-CN / zh-TW / en-us），
          # 约省 3MB。放在发布之后按产物目录裁剪，比在 MSBuild 里做路径匹配可靠：
          # 自包含的拷贝源路径含 build\..\，字符串判定容易静默失效。
          $keep = @('zh-CN','zh-TW','en-us')
          $removed = 0
          Get-ChildItem "build/shell" -Recurse -Filter *.mui | ForEach-Object {
            if ($keep -notcontains $_.Directory.Name) {
              Remove-Item $_.FullName -Force
              $removed++
            }
          }
          Write-Host "已裁剪 $removed 个语言资源文件"

          $shellMb = [math]::Round(((Get-ChildItem "build/shell" -Recurse -File | Measure-Object Length -Sum).Sum / 1MB), 1)
          Write-Host "壳产物体积: $shellMb MB"
        shell: pwsh

      - name: Assemble package (Windows)
        if: runner.os == 'Windows'
        run: |
          # 布局：根级壳 X-iTrader.exe + backend\（runtime\ 嵌入式 Python + code\ 源码）。
          # 与 src/infrastructure/updater.py 的 Windows 假设一致：安装根靠根级
          # X-iTrader.exe 定位（后端在 backend\runtime\ 下，不再与壳同级）。
          $ver = "${{ needs.version.outputs.version }}"
          $stage = "build/pkg"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          Copy-Item "build/shell/*" $stage -Recurse -Force
          Copy-Item "build/backend" "$stage/backend" -Recurse -Force
          # 壳已自包含，不再分发运行环境安装脚本
          Copy-Item "shell-windows/scripts/README.txt" $stage -Force
          # AGPL-3.0 第 4 节：分发目标码时须附带许可证副本
          Copy-Item "LICENSE" "$stage/LICENSE.txt" -Force

          # 自检：壳、后端解释器、入口脚本三者齐备才算可发布
          foreach ($p in @("X-iTrader.exe", "backend/runtime/python.exe", "backend/code/backend_entry.py")) {
            if (-not (Test-Path "$stage/$p")) { Write-Error "成果物缺少 $p"; exit 1 }
          }
          $mb = [math]::Round(((Get-ChildItem $stage -Recurse -File | Measure-Object Length -Sum).Sum / 1MB), 1)
          Write-Host "程序目录体积: $mb MB"

          Compress-Archive -Path "$stage/*" -DestinationPath "build/X-iTrader-Client-$ver-Windows.zip" -Force
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: x-itrader-client-${{ runner.os }}
          path: |
            build/X-iTrader-Client-*-Mac.dmg
            build/X-iTrader-Client-*-Windows.zip

  release:
    needs: [version, build]
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Release ${{ needs.version.outputs.version }}
          body: Automated GitHub release for iTrader Client
          files: |
            artifacts/x-itrader-client-macOS/*.dmg
            artifacts/x-itrader-client-Windows/*.zip
            artifacts/x-itrader-client-src-patch/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
