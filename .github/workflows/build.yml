name: Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          # 差量判定需要与上一版本 tag 做 git diff，拉取完整历史与 tags
          fetch-depth: 0

      - name: Read version from src/__init__.py
        id: ver
        run: |
          VER=$(grep -m1 '^__version__' src/__init__.py | sed 's/.*"\(.*\)"/\1/')
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=$VER" >> "$GITHUB_OUTPUT"

      - name: Create tag
        uses: rickstaa/action-create-tag@v1
        with:
          tag: ${{ steps.ver.outputs.tag }}
          message: "Release ${{ steps.ver.outputs.version }}"
          force_push_tag: true

      # 差量更新：仅当相对上一版本 tag 只有 src/ 下文件变化时，发布全平台共用的
      # src 补丁包（客户端打包时已把 src 外置，替换该目录即完成更新）。
      # 判定为否时不发布补丁包，客户端自动回退下载全量包。
      - name: Build src patch if patch-only change
        id: patch
        run: |
          PREV=$(git tag --sort=-creatordate | grep -vxF "${{ steps.ver.outputs.tag }}" | head -1 || true)
          if [ -z "$PREV" ]; then
            echo "No previous tag; skip patch"
            echo "built=false" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$PREV" HEAD -- . ':(exclude)src/**' | grep -q .; then
            echo "Non-src files changed since $PREV; skip patch"
            echo "built=false" >> "$GITHUB_OUTPUT"
          else
            zip -r "iTrader-${{ steps.ver.outputs.version }}-src.zip" src \
              -x '*/__pycache__/*' '*.pyc'
            echo "built=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload patch artifact
        if: steps.patch.outputs.built == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: itrader-src-patch
          path: iTrader-*-src.zip

  build:
    needs: version
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      # Windows 暂不发布：Qt 打包链已随架构切换移除，SwiftUI 壳仅支持 Apple 平台，
      # 待 Windows 壳落地后恢复 matrix 与 Package 步骤
      matrix:
        os: [macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 与本地 .venv 一致（3.14），保证 CI 产物与本地验证过的打包结果同源
          python-version: "3.14"

      - name: Install dependencies
        run: |
          # 建在仓库根的 .venv：build_app.sh 固定调用 .venv/bin/pyinstaller
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: ./build_app.sh

      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          cd dist
          zip -ry iTrader-${{ needs.version.outputs.version }}-macos.zip iTrader.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: itrader-${{ runner.os }}
          path: dist/iTrader-${{ needs.version.outputs.version }}-*.zip

  release:
    needs: [version, build]
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Release ${{ needs.version.outputs.version }}
          body: Automated GitHub release for iTrader Client
          files: |
            artifacts/itrader-macOS/*.zip
            artifacts/itrader-src-patch/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}