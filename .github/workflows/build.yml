name: Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          # 差量判定需要与上一版本 tag 做 git diff，拉取完整历史与 tags
          fetch-depth: 0

      - name: Read version from src/__init__.py
        id: ver
        run: |
          VER=$(grep -m1 '^__version__' src/__init__.py | sed 's/.*"\(.*\)"/\1/')
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=$VER" >> "$GITHUB_OUTPUT"

      - name: Create tag
        uses: rickstaa/action-create-tag@v1
        with:
          tag: ${{ steps.ver.outputs.tag }}
          message: "Release ${{ steps.ver.outputs.version }}"
          force_push_tag: true

      # 差量更新：仅当相对上一版本 tag 只有 src/ 下文件变化时，发布全平台共用的
      # src 补丁包（客户端打包时已把 src 外置，替换该目录即完成更新）。
      # 判定为否时不发布补丁包，客户端自动回退下载全量包。
      - name: Build src patch if patch-only change
        id: patch
        run: |
          PREV=$(git tag --sort=-creatordate | grep -vxF "${{ steps.ver.outputs.tag }}" | head -1 || true)
          if [ -z "$PREV" ]; then
            echo "No previous tag; skip patch"
            echo "built=false" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$PREV" HEAD -- . ':(exclude)src/**' | grep -q .; then
            echo "Non-src files changed since $PREV; skip patch"
            echo "built=false" >> "$GITHUB_OUTPUT"
          else
            zip -r "x-itrader-client-${{ steps.ver.outputs.version }}-src.zip" src \
              -x '*/__pycache__/*' '*.pyc'
            echo "built=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload patch artifact
        if: steps.patch.outputs.built == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: x-itrader-client-src-patch
          path: x-itrader-client-*-src.zip

  build:
    needs: version
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 与本地 .venv 一致（3.14），保证 CI 产物与本地验证过的打包结果同源；
          # Windows 上若个别依赖缺 cp314 wheel 会在此暴露，届时回落 3.13
          python-version: "3.14"

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          # 建在仓库根的 .venv：build_app.sh 固定调用 .venv/bin/pyinstaller
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          # 建在仓库根的 .venv：打包步骤固定调用 .venv\Scripts\pyinstaller
          python -m venv .venv
          .venv\Scripts\python -m pip install --upgrade pip
          .venv\Scripts\pip install -r requirements.txt

      # ---------- macOS ----------

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          # build_app.sh 产出 .app（含 PyInstaller 后端），build_dmg.sh 再封装成
          # dmg；两者都落在仓库上一级。
          ./build_app.sh
          ./build_dmg.sh

      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          # dmg 已在仓库上一级生成，移入仓库 dist/ 供 upload-artifact 收集
          mkdir -p "$GITHUB_WORKSPACE/dist"
          mv ../x-itrader-client-${{ needs.version.outputs.version }}-macos.dmg "$GITHUB_WORKSPACE/dist/"

      # ---------- Windows ----------

      - name: Setup .NET (Windows)
        if: runner.os == 'Windows'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build backend (Windows)
        if: runner.os == 'Windows'
        run: |
          # specs/backend.spec 在 win32 下把产物命名为 X-iTrader-Backend
          .venv\Scripts\pyinstaller --workpath=build/backend --distpath=dist --noconfirm specs/backend.spec
          if (-not (Test-Path "dist/X-iTrader-Backend/X-iTrader-Backend.exe")) {
            Write-Error "未找到后端产物 dist/X-iTrader-Backend/X-iTrader-Backend.exe"
            exit 1
          }
        shell: pwsh

      - name: Publish shell (Windows)
        if: runner.os == 'Windows'
        run: |
          # 自包含发布：.NET 运行时与 Windows App SDK 原生库都进产物，
          # 目标机无需安装任何运行环境（自包含由 csproj 的 SelfContained=true
          # 决定，命令行不再覆盖）
          dotnet publish shell-windows/X-iTrader.Shell.csproj `
            -c Release -r win-x64 -p:Platform=x64 `
            -o dist/shell
          if (-not (Test-Path "dist/shell/X-iTrader.exe")) {
            Write-Error "未找到壳产物 dist/shell/X-iTrader.exe"
            exit 1
          }
        shell: pwsh

      - name: Trim shell language resources (Windows)
        if: runner.os == 'Windows'
        run: |
          # 裁掉 WinUI 原生库的 86 种语言 .mui（保留 zh-CN / zh-TW / en-us），
          # 约省 3MB。放在发布之后按产物目录裁剪，比在 MSBuild 里做路径匹配可靠：
          # 自包含的拷贝源路径含 build\..\，字符串判定容易静默失效。
          $keep = @('zh-CN','zh-TW','en-us')
          $removed = 0
          Get-ChildItem "dist/shell" -Recurse -Filter *.mui | ForEach-Object {
            if ($keep -notcontains $_.Directory.Name) {
              Remove-Item $_.FullName -Force
              $removed++
            }
          }
          Write-Host "已裁剪 $removed 个语言资源文件"

          $shellMb = [math]::Round(((Get-ChildItem "dist/shell" -Recurse -File | Measure-Object Length -Sum).Sum / 1MB), 1)
          Write-Host "壳产物体积: $shellMb MB"
        shell: pwsh

      - name: Assemble package (Windows)
        if: runner.os == 'Windows'
        run: |
          # 扁平布局：壳与后端可执行文件同级，后端依赖放 _internal\
          # 该形态与 src/infrastructure/updater.py 的 Windows 假设一致
          # （安装根 = 后端 exe 的父目录，根级有 X-iTrader.exe 作为重启目标）。
          $ver = "${{ needs.version.outputs.version }}"
          $stage = "dist/pkg"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          Copy-Item "dist/shell/*" $stage -Recurse -Force
          Copy-Item "dist/X-iTrader-Backend/X-iTrader-Backend.exe" $stage -Force
          Copy-Item "dist/X-iTrader-Backend/_internal" $stage -Recurse -Force
          # 壳已自包含，不再分发运行环境安装脚本
          Copy-Item "shell-windows/scripts/README.txt" $stage -Force

          Compress-Archive -Path "$stage/*" -DestinationPath "dist/x-itrader-client-$ver-windows.zip" -Force
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: x-itrader-client-${{ runner.os }}
          path: |
            dist/x-itrader-client-*-macos.dmg
            dist/x-itrader-client-*-windows.zip

  release:
    needs: [version, build]
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Release ${{ needs.version.outputs.version }}
          body: Automated GitHub release for iTrader Client
          files: |
            artifacts/x-itrader-client-macOS/*.dmg
            artifacts/x-itrader-client-Windows/*.zip
            artifacts/x-itrader-client-src-patch/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
